  </g>
  <path d="M239 238l4 4 4-4Z" fill="#e58aa5"/>
  <g fill="none" stroke="#1b1d2a" stroke-width="2" stroke-linecap="round">
    <path d="M243 242q-5 6-10 2M243 242q5 6 10 2"/>
  </g>
  <!-- paw that did it -->
