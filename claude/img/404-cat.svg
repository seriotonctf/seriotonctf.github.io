    <circle cx="70" cy="70" r="2"/><circle cx="160" cy="40" r="1.5"/><circle cx="420" cy="80" r="2"/>
    <circle cx="340" cy="45" r="1.5"/><circle cx="250" cy="95" r="1.5"/><circle cx="460" cy="170" r="1.5"/>
  </g>
  <!-- table -->
  <rect x="40" y="300" width="330" height="16" rx="4" fill="#8a6a4f"/>
  <rect x="70" y="316" width="14" height="150" fill="#6f543f"/>
  <rect x="320" y="316" width="14" height="150" fill="#6f543f"/>
  <!-- cat -->
  <g fill="#ece6da">
    <path d="M118 300c-14 0-18-12-14-28 8-38 44-60 96-60h20c40 0 64 24 64 60v28Z"/>
    <path d="M196 214l7-48 34 26ZM251 190l32-24 6 48Z"/>
